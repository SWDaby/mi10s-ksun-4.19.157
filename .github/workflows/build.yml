name: Build thyme Droidspaces kernel

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: 'Kernel source repo'
        required: false
        default: 'https://github.com/bcggxx/android_kernel_xiaomi_moon_sm8250'
      kernel_branch:
        description: 'Kernel source commit SHA or branch'
        required: false
        default: '931792aa4683961ed6457e577477d68f164e779b'
      defconfig:
        description: 'Defconfig (stock config baseline)'
        required: false
        default: 'stock/thyme_stock_defconfig'
      allow_crc_mismatch:
        description: 'Load stock vendor modules even when symbol CRCs differ (1=yes)'
        required: false
        default: '1'
      droidspaces_layer:
        description: 'Apply the Droidspaces config layer (0 = pure stock config, diagnostic)'
        required: false
        default: '1'
      disable_relr:
        description: 'Disable CONFIG_RELR to match the stock build (1=yes)'
        required: false
        default: '1'
      disable_kaslr:
        description: 'Disable CONFIG_RANDOMIZE_BASE (1=yes, matches this tree own thyme config)'
        required: false
        default: '1'
      allow_config_drift:
        description: 'Skip the stock-fidelity gate (1=yes, diagnostic builds only)'
        required: false
        default: '0'
      disable_arm64_hardening:
        description: 'Disable SW_TTBR0_PAN / HARDEN_BRANCH_PREDICTOR / HARDEN_EL2_VECTORS (1=yes)'
        required: false
        default: '0'
      qemu_probe:
        description: 'Enable PL011 console so the image can be booted in local QEMU (1=yes, never flash this)'
        required: false
        default: '0'
      publish_release:
        description: 'Repack boot.img and publish a no-root release (1=yes; refused when qemu_probe=1)'
        required: false
        default: '0'
      release_tag:
        description: 'Release tag (empty = release-<run_number>)'
        required: false
        default: ''

concurrency:
  group: thyme-${{ inputs.kernel_branch }}-${{ inputs.defconfig }}-${{ inputs.droidspaces_layer }}-${{ inputs.allow_crc_mismatch }}-${{ inputs.disable_relr }}-${{ inputs.disable_kaslr }}-${{ inputs.allow_config_drift }}-${{ inputs.disable_arm64_hardening }}-${{ inputs.qemu_probe }}
  cancel-in-progress: true

jobs:
  build:
    name: thyme / ${{ inputs.kernel_branch }} / layer=${{ inputs.droidspaces_layer }} crc=${{ inputs.allow_crc_mismatch }} relr_off=${{ inputs.disable_relr }} kaslr_off=${{ inputs.disable_kaslr }} qemu=${{ inputs.qemu_probe }}
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      - name: Checkout build scripts
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential cpio flex libelf-dev libssl-dev lz4 \
            python3 rsync zip unzip wget ca-certificates openssl \
            device-tree-compiler perl

      - name: Clone kernel source
        env:
          KREPO: ${{ inputs.kernel_repo }}
          KREF: ${{ inputs.kernel_branch }}
        run: |
          git init -q "$GITHUB_WORKSPACE/kernel"
          cd "$GITHUB_WORKSPACE/kernel"
          git remote add origin "$KREPO"
          git fetch --depth=1 origin "$KREF"
          git checkout -q FETCH_HEAD
          echo "kernel HEAD: $(git rev-parse HEAD)"
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) ' Makefile
          echo "--- 基线树里的 thyme 配置（不同树路径不同，仅提示） ---"
          ls -l arch/arm64/configs/stock/thyme_stock_defconfig 2>/dev/null \
            || ls -l arch/arm64/configs/thyme_defconfig 2>/dev/null \
            || ls arch/arm64/configs | head -20

      - name: Setup AOSP Clang r416183b
        run: |
          mkdir -p "$HOME/aosp-clang"
          wget -q --tries=3 --timeout=120 \
            -O /tmp/clang.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/428d18d9732aa7ebfcaed87a582d86155db878d4/clang-r416183b.tar.gz"
          tar -xzf /tmp/clang.tar.gz -C "$HOME/aosp-clang"
          rm -f /tmp/clang.tar.gz
          "$HOME/aosp-clang/bin/clang" --version

      - name: Configure (stock config + Droidspaces layer)
        env:
          KERNEL_DIR: ${{ github.workspace }}/kernel
          OUT: ${{ github.workspace }}/out
          DIST: ${{ github.workspace }}/dist
          REPO_ROOT: ${{ github.workspace }}
          DEFCONFIG: ${{ inputs.defconfig }}
          ALLOW_CRC_MISMATCH: ${{ inputs.allow_crc_mismatch }}
          DROIDSPACES_LAYER: ${{ inputs.droidspaces_layer }}
          DISABLE_RELR: ${{ inputs.disable_relr }}
          DISABLE_KASLR: ${{ inputs.disable_kaslr }}
          ALLOW_CONFIG_DRIFT: ${{ inputs.allow_config_drift }}
          DISABLE_ARM64_HARDENING: ${{ inputs.disable_arm64_hardening }}
          QEMU_PROBE: ${{ inputs.qemu_probe }}
          # pipa 树（bcggxx）的 5.x 回移补丁必须应用；其它基线树允许跳过不兼容的可选补丁。
          PATCH_OPTIONAL: ${{ contains(inputs.kernel_repo, 'moon_sm8250') && '0' || '1' }}
        run: bash scripts/configure.sh

      - name: Build kernel Image
        env:
          KERNEL_DIR: ${{ github.workspace }}/kernel
          OUT: ${{ github.workspace }}/out
          DIST: ${{ github.workspace }}/dist
          REPO_ROOT: ${{ github.workspace }}
        run: bash scripts/build.sh

      - name: Repack boot.img (no root)
        if: inputs.publish_release == '1'
        env:
          QEMU_PROBE: ${{ inputs.qemu_probe }}
        run: |
          if [ "$QEMU_PROBE" = "1" ]; then
            echo "::error::qemu_probe=1 的镜像禁止发布（探针版改过 setup.c，不能刷机）"
            exit 1
          fi
          python3 tools/pack_boot.py \
            --template bootimg/thyme-boot-template.bin \
            --manifest bootimg/thyme-boot-template.json \
            --image dist/Image \
            --out dist/boot-thyme-noroot.img
          python3 tools/verify_boot.py \
            --boot dist/boot-thyme-noroot.img \
            --manifest bootimg/thyme-boot-template.json \
            --image dist/Image

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thyme-droidspaces-${{ github.run_number }}
          path: |
            dist/Image
            dist/boot-thyme-noroot.img
            dist/AnyKernel3-thyme-droidspaces.zip
            dist/config-final.txt
            dist/config-base.txt
            dist/config-diff.txt
            dist/stock-check.txt
            dist/Module.symvers
            dist/System.map
            dist/start_kernel.dis
            dist/crc-mode.txt
            dist/build.log
          if-no-files-found: warn
          retention-days: 30

      - name: Publish release
        if: inputs.publish_release == '1' && success()
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || format('release-{0}', github.run_number) }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/dist"
          sha256sum Image boot-thyme-noroot.img AnyKernel3-thyme-droidspaces.zip System.map config-final.txt > SHA256SUMS
          BOOT_MD5=$(md5sum boot-thyme-noroot.img | cut -d' ' -f1)
          IMG_MD5=$(md5sum Image | cut -d' ' -f1)
          VSTR=$(grep -m1 -aoE 'Linux version [0-9][0-9A-Za-z.+-]*' Image | cut -d' ' -f3)
          cat > /tmp/notes.md <<EOF
          thyme（小米 10S，SM8250）Droidspaces 内核 —— 无 root 正式版

          | 项 | 值 |
          | --- | --- |
          | 内核版本 | \`$VSTR\`（与原厂 \`uname -r\` 一致） |
          | 源码 | \`${{ inputs.kernel_repo }}\` @ \`${{ inputs.kernel_branch }}\` |
          | defconfig | \`${{ inputs.defconfig }}\` |
          | 构建 | run [${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |

          **本 release 不含 root**：\`boot-thyme-noroot.img\` 只替换了 \`boot.img\` 的 kernel 段，
          ramdisk / vbmeta / cmdline / 分区大小逐字节保持不变（AVB 未重签，需已解锁 bootloader）。

          | 文件 | MD5 |
          | --- | --- |
          | \`boot-thyme-noroot.img\` | \`$BOOT_MD5\` |
          | \`Image\` | \`$IMG_MD5\` |

          刷入（fastboot）：

          \`\`\`
          fastboot flash boot boot-thyme-noroot.img
          fastboot reboot
          \`\`\`

          - 适用固件：MIUI 14（Android 13）；换上别的固件前请用该固件的原厂 boot.img 重新打包。
          - 配置满足 Android 13 FCM（\`compatibility_matrix.5.xml\`，251 项），开机不弹
            "There's an internal problem with your device"。
          - \`SYSVIPC\` 与 IPv6 NAT 保持原厂的 \`n\`；容器 IPv4 NAT 正常。
          - 需要 root 时用管理器自带的 \`kptools\` + \`kpimg\` 对 \`Image\` 重新打补丁后重打包。
          - 刷坏回退：音量减 + 电源约 15 秒进 fastboot，刷回原厂 boot.img 或上一个 release。
          EOF
          gh release create "$TAG" \
            --title "thyme 内核 $VSTR 正式版（无 root）· release ${{ github.run_number }}" \
            --notes-file /tmp/notes.md \
            boot-thyme-noroot.img Image AnyKernel3-thyme-droidspaces.zip System.map config-final.txt SHA256SUMS
